<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-label="Comparison of built-in array, std::array and std::vector"><title>Comparison of built-in array, std::array and std::vector</title><style>@keyframes a1{0%{opacity:0.15}50.0%{opacity:1}100%{opacity:0.15}}.a1{animation:a1 3s infinite ease-in-out}</style><rect width="860" height="290" rx="14" fill="#0f172a"/><rect x="30" y="20" width="260" height="250" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="46" y="52" font-size="17" fill="#e2e8f0" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">int arr[5]</text><text x="46" y="74" font-size="14" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">built-in array</text><rect x="46" y="88" width="104" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" /><text x="98" y="105" font-size="12" fill="#fbbf24" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">FIXED SIZE</text><rect x="46" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="66" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><rect x="92" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="112" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><rect x="138" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="158" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text><rect x="184" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="204" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text><rect x="230" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="250" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">50</text><text x="46" y="205" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• no .size() member</text><text x="46" y="229" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• decays to a pointer in parameters</text><text x="46" y="253" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• no bounds checking</text><rect x="310" y="20" width="260" height="250" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="326" y="52" font-size="17" fill="#e2e8f0" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">std::array&lt;int, 5&gt;</text><text x="326" y="74" font-size="14" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">fixed-size container</text><rect x="326" y="88" width="104" height="24" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" /><text x="378" y="105" font-size="12" fill="#fbbf24" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">FIXED SIZE</text><rect x="326" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="346" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><rect x="372" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="392" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><rect x="418" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="438" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text><rect x="464" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="484" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text><rect x="510" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" /><text x="530" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">50</text><text x="326" y="205" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• size is part of the type</text><text x="326" y="229" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• .size(), iterators, range-for</text><text x="326" y="253" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• contiguous storage</text><rect x="590" y="20" width="260" height="250" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="606" y="52" font-size="17" fill="#e2e8f0" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">std::vector&lt;int&gt;</text><text x="606" y="74" font-size="14" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">dynamic array</text><rect x="606" y="88" width="104" height="24" rx="12" fill="none" stroke="#4ade80" stroke-width="1.5" /><text x="658" y="105" font-size="12" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">RESIZABLE</text><rect x="606" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="2" /><text x="626" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><rect x="652" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="2" /><text x="672" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><rect x="698" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="2" /><text x="718" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text><rect x="744" y="128" width="40" height="40" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="2" /><text x="764" y="154" font-size="15" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text><g class="a1" ><rect x="790" y="128" width="40" height="40" rx="6" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="5 3"/><text x="810" y="154" font-size="20" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">+</text></g><text x="606" y="205" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• push_back() / pop_back()</text><text x="606" y="229" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• grows &amp; shrinks at runtime</text><text x="606" y="253" font-size="13.5" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">• default choice for DSA</text></svg>