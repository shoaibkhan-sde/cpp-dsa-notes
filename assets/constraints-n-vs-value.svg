<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="n is the number of elements, arr[i] is the value of one element"><title>n is the number of elements, arr[i] is the value of one element</title><style>@keyframes a1{0%{opacity:0}2.0%{opacity:0}4.0%{opacity:1}31.0%{opacity:1}33.0%{opacity:0}100%{opacity:0}}.a1{animation:a1 15s infinite ease-in-out}@keyframes a2{0%{opacity:0}33.0%{opacity:0}35.0%{opacity:1}62.0%{opacity:1}64.0%{opacity:0}100%{opacity:0}}.a2{animation:a2 15s infinite ease-in-out}@keyframes a3{0%{opacity:0}64.0%{opacity:0}66.0%{opacity:1}93.0%{opacity:1}95.0%{opacity:0}100%{opacity:0}}.a3{animation:a3 15s infinite ease-in-out}@keyframes a4{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a4{animation:a4 15s infinite ease-in-out}</style><rect width="820" height="330" rx="14" fill="#0f172a"/><g class="a4" style=""><g class="a1" style=""><text x="410" y="40" font-size="19" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">int arr[] = {1};          // n = 1</text><rect x="360" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="410" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">1</text><text x="410" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[0]</text><line x1="360" y1="190" x2="460" y2="190" stroke="#38bdf8" stroke-width="2.5" /><line x1="360" y1="184" x2="360" y2="196" stroke="#38bdf8" stroke-width="2.5" /><line x1="460" y1="184" x2="460" y2="196" stroke="#38bdf8" stroke-width="2.5" /><text x="410" y="226" font-size="24" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">n = 1</text><text x="410" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">one element → n = 1</text></g><g class="a2" style=""><text x="410" y="40" font-size="19" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">int arr[] = {10000};      // n = 1</text><rect x="360" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="410" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10000</text><text x="410" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[0]</text><line x1="360" y1="190" x2="460" y2="190" stroke="#38bdf8" stroke-width="2.5" /><line x1="360" y1="184" x2="360" y2="196" stroke="#38bdf8" stroke-width="2.5" /><line x1="460" y1="184" x2="460" y2="196" stroke="#38bdf8" stroke-width="2.5" /><text x="410" y="226" font-size="24" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">n = 1</text><text x="410" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">one element → n = 1  (the value 10000 does not change the size)</text></g><g class="a3" style=""><text x="410" y="40" font-size="19" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">int arr[] = {1, 2, 3, 10000};   // n = 4</text><rect x="180" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="230" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">1</text><text x="230" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[0]</text><rect x="300" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="350" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">2</text><text x="350" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[1]</text><rect x="420" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="470" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">3</text><text x="470" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[2]</text><rect x="540" y="95" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="590" y="139" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10000</text><text x="590" y="83" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">arr[3]</text><line x1="180" y1="190" x2="640" y2="190" stroke="#38bdf8" stroke-width="2.5" /><line x1="180" y1="184" x2="180" y2="196" stroke="#38bdf8" stroke-width="2.5" /><line x1="640" y1="184" x2="640" y2="196" stroke="#38bdf8" stroke-width="2.5" /><text x="410" y="226" font-size="24" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">n = 4</text><text x="410" y="262" font-size="17" fill="#e2e8f0" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">four elements → n = 4</text></g><text x="410" y="310" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">n = how many elements   •   arr[i] = the value of one element</text></g></svg>