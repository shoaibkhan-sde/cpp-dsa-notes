<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Erasing the element at index 2 shifts later elements left"><title>Erasing the element at index 2 shifts later elements left</title><style>@keyframes a1{0%{opacity:0}55.0%{opacity:0}57.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a1{animation:a1 14s infinite ease-in-out}@keyframes a2{0%{opacity:1}16.0%{opacity:1}26.0%{opacity:0}100%{opacity:0}}.a2{animation:a2 14s infinite ease-in-out}@keyframes a3{0%{transform:translate(0px,0px);opacity:1}32.0%{transform:translate(0px,0px);opacity:1}46.0%{transform:translate(-120px,0px);opacity:1}100%{transform:translate(-120px,0px);opacity:1}}.a3{animation:a3 14s infinite ease-in-out}@keyframes a4{0%{transform:translate(0px,0px);opacity:1}48.0%{transform:translate(0px,0px);opacity:1}62.0%{transform:translate(-120px,0px);opacity:1}100%{transform:translate(-120px,0px);opacity:1}}.a4{animation:a4 14s infinite ease-in-out}@keyframes a5{0%{opacity:0}4.0%{opacity:0}6.0%{opacity:1}30.0%{opacity:1}32.0%{opacity:0}100%{opacity:0}}.a5{animation:a5 14s infinite ease-in-out}@keyframes a6{0%{opacity:0}30.0%{opacity:0}32.0%{opacity:1}47.0%{opacity:1}49.0%{opacity:0}100%{opacity:0}}.a6{animation:a6 14s infinite ease-in-out}@keyframes a7{0%{opacity:0}47.0%{opacity:0}49.0%{opacity:1}63.0%{opacity:1}65.0%{opacity:0}100%{opacity:0}}.a7{animation:a7 14s infinite ease-in-out}@keyframes a8{0%{opacity:0}63.0%{opacity:0}65.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a8{animation:a8 14s infinite ease-in-out}@keyframes a9{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a9{animation:a9 14s infinite ease-in-out}</style><rect width="800" height="330" rx="14" fill="#0f172a"/><g class="a9" ><text x="400" y="36" font-size="20" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">v.erase(v.begin() + 2);</text><text x="162.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">0</text><text x="282.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1</text><text x="402.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">2</text><text x="522.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">3</text><text x="642.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">4</text><g class="a1" ><rect x="590" y="107" width="104" height="64" rx="8" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><text x="642.0" y="147" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">unused</text></g><rect x="110" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="162.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><rect x="230" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="282.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><g class="a2" ><rect x="350" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="402.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text><rect x="350" y="107" width="104" height="64" rx="8" fill="rgba(248,113,113,0.25)" stroke="#f87171" stroke-width="3" /></g><g class="a3" ><rect x="470" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="522.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text></g><g class="a4" ><rect x="590" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="642.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">50</text></g><g class="a5" ><text x="400" y="225" font-size="21" fill="#f87171" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 1: remove 30</text></g><g class="a6" ><text x="400" y="225" font-size="21" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 2: shift 40 ←</text></g><g class="a7" ><text x="400" y="225" font-size="21" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 3: shift 50 ←</text></g><g class="a8" ><text x="400" y="225" font-size="21" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">v = [10, 20, 40, 50]    → O(n) (elements shifted)</text></g><text x="400" y="300" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">pop_back() removes the last element in O(1) — nothing needs to shift</text></g></svg>