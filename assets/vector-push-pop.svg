<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="std::vector push_back and pop_back"><title>std::vector push_back and pop_back</title><style>@keyframes a1{0%{opacity:1}32.0%{opacity:1}34.0%{opacity:0}100%{opacity:0}}.a1{animation:a1 10s infinite ease-in-out}@keyframes a2{0%{opacity:0}32.0%{opacity:0}34.0%{opacity:1}66.0%{opacity:1}68.0%{opacity:0}100%{opacity:0}}.a2{animation:a2 10s infinite ease-in-out}@keyframes a3{0%{opacity:0}66.0%{opacity:0}68.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a3{animation:a3 10s infinite ease-in-out}@keyframes a4{0%{transform:translate(0px,-30px);opacity:0}32.0%{transform:translate(0px,-30px);opacity:0}40.0%{transform:translate(0px,0px);opacity:1}66.0%{transform:translate(0px,0px);opacity:1}72.0%{transform:translate(0px,-30px);opacity:0}100%{transform:translate(0px,-30px);opacity:0}}.a4{animation:a4 10s infinite ease-in-out}@keyframes a5{0%{opacity:1}32.0%{opacity:1}34.0%{opacity:0}100%{opacity:0}}.a5{animation:a5 10s infinite ease-in-out}@keyframes a6{0%{opacity:0}32.0%{opacity:0}34.0%{opacity:1}66.0%{opacity:1}68.0%{opacity:0}100%{opacity:0}}.a6{animation:a6 10s infinite ease-in-out}@keyframes a7{0%{opacity:0}66.0%{opacity:0}68.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a7{animation:a7 10s infinite ease-in-out}@keyframes a8{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a8{animation:a8 10s infinite ease-in-out}</style><rect width="760" height="280" rx="14" fill="#0f172a"/><g class="a8" ><g class="a1" ><text x="380" y="40" font-size="19" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">std::vector&lt;int&gt; values{10, 20, 30};</text></g><g class="a2" ><text x="380" y="40" font-size="19" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">values.push_back(40);</text></g><g class="a3" ><text x="380" y="40" font-size="19" fill="#f87171" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">values.pop_back();   // returns void</text></g><rect x="95" y="100" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="155.0" y="144.0" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><text x="155.0" y="88" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">0</text><rect x="245" y="100" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="305.0" y="144.0" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><text x="305.0" y="88" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1</text><rect x="395" y="100" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="455.0" y="144.0" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text><text x="455.0" y="88" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">2</text><g class="a4" ><rect x="545" y="100" width="120" height="70" rx="8" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="2.5" /><text x="605.0" y="144" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text><text x="605.0" y="88" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">3</text></g><g class="a5" ><text x="380" y="215" font-size="22" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">size = 3</text></g><g class="a6" ><text x="380" y="215" font-size="22" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">size = 4</text></g><g class="a7" ><text x="380" y="215" font-size="22" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">size = 3</text></g><text x="380" y="254" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">elements stay contiguous — push_back adds at the end, pop_back removes the last</text></g></svg>