<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-label="Array elements stored contiguously with illustrative addresses"><title>Array elements stored contiguously with illustrative addresses</title><style>@keyframes a1{0%{opacity:0}3.0%{opacity:0}5.0%{opacity:1}21.0%{opacity:1}23.0%{opacity:0}100%{opacity:0}}.a1{animation:a1 12s infinite ease-in-out}@keyframes a2{0%{opacity:0}3.0%{opacity:0}5.0%{opacity:1}21.0%{opacity:1}23.0%{opacity:0}100%{opacity:0}}.a2{animation:a2 12s infinite ease-in-out}@keyframes a3{0%{opacity:0}21.0%{opacity:0}23.0%{opacity:1}39.0%{opacity:1}41.0%{opacity:0}100%{opacity:0}}.a3{animation:a3 12s infinite ease-in-out}@keyframes a4{0%{opacity:0}21.0%{opacity:0}23.0%{opacity:1}39.0%{opacity:1}41.0%{opacity:0}100%{opacity:0}}.a4{animation:a4 12s infinite ease-in-out}@keyframes a5{0%{opacity:0}39.0%{opacity:0}41.0%{opacity:1}57.0%{opacity:1}59.0%{opacity:0}100%{opacity:0}}.a5{animation:a5 12s infinite ease-in-out}@keyframes a6{0%{opacity:0}39.0%{opacity:0}41.0%{opacity:1}57.0%{opacity:1}59.0%{opacity:0}100%{opacity:0}}.a6{animation:a6 12s infinite ease-in-out}@keyframes a7{0%{opacity:0}57.0%{opacity:0}59.0%{opacity:1}75.0%{opacity:1}77.0%{opacity:0}100%{opacity:0}}.a7{animation:a7 12s infinite ease-in-out}@keyframes a8{0%{opacity:0}57.0%{opacity:0}59.0%{opacity:1}75.0%{opacity:1}77.0%{opacity:0}100%{opacity:0}}.a8{animation:a8 12s infinite ease-in-out}@keyframes a9{0%{opacity:0}75.0%{opacity:0}77.0%{opacity:1}93.0%{opacity:1}95.0%{opacity:0}100%{opacity:0}}.a9{animation:a9 12s infinite ease-in-out}@keyframes a10{0%{opacity:0}75.0%{opacity:0}77.0%{opacity:1}93.0%{opacity:1}95.0%{opacity:0}100%{opacity:0}}.a10{animation:a10 12s infinite ease-in-out}@keyframes a11{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a11{animation:a11 12s infinite ease-in-out}</style><rect width="820" height="310" rx="14" fill="#0f172a"/><g class="a11" ><text x="40" y="40" font-size="15" fill="#94a3b8" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Illustrative addresses  (sizeof(int) == 4, base = 1000)</text><rect x="40" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="110.0" y="153" font-size="19" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">arr[0] = 10</text><text x="110.0" y="98" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1000</text><rect x="192" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="262.0" y="153" font-size="19" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">arr[1] = 20</text><text x="262.0" y="98" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1004</text><rect x="344" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="414.0" y="153" font-size="19" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">arr[2] = 30</text><text x="414.0" y="98" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1008</text><rect x="496" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="566.0" y="153" font-size="19" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">arr[3] = 40</text><text x="566.0" y="98" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1012</text><rect x="648" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="718.0" y="153" font-size="19" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">arr[4] = 50</text><text x="718.0" y="98" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1016</text><line x1="40" y1="200" x2="180" y2="200" stroke="#38bdf8" stroke-width="2"/><text x="110.0" y="219" font-size="13" fill="#38bdf8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">4 bytes</text><g class="a1" ><rect x="40" y="110" width="140" height="70" rx="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="3" /></g><g class="a2" ><text x="410" y="258" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">address(arr[0]) = 1000 + 0 × 4 = 1000</text></g><g class="a3" ><rect x="192" y="110" width="140" height="70" rx="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="3" /></g><g class="a4" ><text x="410" y="258" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">address(arr[1]) = 1000 + 1 × 4 = 1004</text></g><g class="a5" ><rect x="344" y="110" width="140" height="70" rx="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="3" /></g><g class="a6" ><text x="410" y="258" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">address(arr[2]) = 1000 + 2 × 4 = 1008</text></g><g class="a7" ><rect x="496" y="110" width="140" height="70" rx="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="3" /></g><g class="a8" ><text x="410" y="258" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">address(arr[3]) = 1000 + 3 × 4 = 1012</text></g><g class="a9" ><rect x="648" y="110" width="140" height="70" rx="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="3" /></g><g class="a10" ><text x="410" y="258" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">address(arr[4]) = 1000 + 4 × 4 = 1016</text></g><text x="410" y="292" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">address = base address + i × sizeof(element)   →   O(1) access</text></g></svg>