<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Accessing an element by index in O(1)"><title>Accessing an element by index in O(1)</title><style>@keyframes a1{0%{opacity:0}8.0%{opacity:0}10.0%{opacity:1}92.0%{opacity:1}94.0%{opacity:0}100%{opacity:0}}.a1{animation:a1 8s infinite ease-in-out}@keyframes a2{0%{transform:translate(0px,-70px);opacity:0}28.0%{transform:translate(0px,-70px);opacity:0}42.0%{transform:translate(0px,0px);opacity:1}92.0%{transform:translate(0px,0px);opacity:1}96.0%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.a2{animation:a2 8s infinite ease-in-out}@keyframes a3{0%{opacity:0}50.0%{opacity:0}52.0%{opacity:1}92.0%{opacity:1}94.0%{opacity:0}100%{opacity:0}}.a3{animation:a3 8s infinite ease-in-out}@keyframes a4{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a4{animation:a4 8s infinite ease-in-out}</style><rect width="760" height="250" rx="14" fill="#0f172a"/><g class="a4" ><text x="380" y="36" font-size="19" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">int value = arr[2];   // 30</text><rect x="70" y="90" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="120.0" y="134.0" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><text x="120.0" y="78" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">0</text><rect x="190" y="90" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="240.0" y="134.0" font-size="26" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><text x="240.0" y="78" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier Ne