="Consolas,Menlo,'Courier New',monospace" font-weight="700">≈ 2×10^7</text></g><g class="a22" style="transform-box:fill-box;transform-origin:50% 100%"><rect x="590" y="94" width="110" height="216" rx="6" fill="#f87171" stroke="#f87171" stroke-width="0" /></g><g class="a23" style=""><text x="645.0" y="86" font-size="15" fill="#f87171" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10^12</text></g><g class="a24" style=""><text x="440" y="368" font-size="17" fill="#f87171" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">O(n) and O(n log n) fit; O(n²) is hopeless</text></g></g></svg>