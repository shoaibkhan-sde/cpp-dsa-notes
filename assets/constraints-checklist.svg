e the largest result and intermediates</text><g class="a11" style=""><rect x="40" y="244" width="690" height="36" rx="8" fill="rgba(251,191,36,0.2)" stroke="none" stroke-width="0" /></g><g class="a12" style=""><rect x="60" y="251" width="24" height="24" rx="5" fill="#14532d" stroke="#4ade80" stroke-width="2" /><text x="72" y="269" font-size="17" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text></g><rect x="60" y="288" width="24" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="112" y="306" font-size="17" fill="#94a3b8" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">7.</text><text x="124" y="306" font-size="18" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Consider total input across all test cases</text><g class="a13" style=""><rect x="40" y="281" width="690" height="36" rx="8" fill="rgba(251,191,36,0.2)" stroke="none" stroke-width="0" /></g><g class="a14" style=""><rect x="60" y="288" width="24" height="24" rx="5" fill="#14532d" stroke="#4ade80" stroke-width="2" /><text x="72" y="306" font-size="17" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text></g><rect x="60" y="325" width="24" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="112" y="343" font-size="17" fill="#94a3b8" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">8.</text><text x="124" y="343" font-size="18" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Choose an algorithm using time and memory limits</text><g class="a15" style=""><rect x="40" y="318" width="690" height="36" rx="8" fill="rgba(251,191,36,0.2)" stroke="none" stroke-width="0" /></g><g class="a16" style=""><rect x="60" y="325" width="24" height="24" rx="5" fill=