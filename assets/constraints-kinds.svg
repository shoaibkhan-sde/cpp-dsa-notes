/style><rect width="880" height="250" rx="14" fill="#0f172a"/><g class="a6" style=""><g class="a1" style=""><rect x="10" y="50" width="164" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" /><text x="92" y="82" font-size="17" fill="#38bdf8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Array</text><text x="92" y="116" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">size: 1..100000</text><text x="92" y="142" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">values: -100000..100000</text></g><g class="a2" style=""><rect x="184" y="50" width="164" height="160" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2.5" /><text x="266" y="82" font-size="17" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">String</text><text x="266" y="116" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">length: 1..100000</text><text x="266" y="142" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">characters in the string</text></g><g class="a3" style=""><rect x="358" y="50" width="164" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" /><text x="440" y="82" font-size="17" fill="#fbbf24" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Test cases</text><text x="440" y="116" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">t: 1..100</text><text x="440" y="142" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">add up the total work</text></g><g class="a4" style=""><rect x="532" y="50" width="164" height="160" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" /><text x="614" y="82" font-size="17" fill="#c084fc" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Graph</text><text x="614" y="116" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">V: 1..100000</text><text x="614" y="142" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">E: 0..200000</text><text x="614" y="168" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">list vs matrix?</text></g><g class="a5" style=""><rect x="706" y="50" width="164" height="160" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2.5" /><text x="788" y="82" font-size="17" fill="#f87171" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Coordinates</text><text x="788" y="116" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">x: -10^9..10^9</text><text x="788" y="142" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">differences &amp; products</text><text x="788" y="168" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">can grow much larger</text></g><text x="440" y="236" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">each limit answers a different question</text></g></svg>