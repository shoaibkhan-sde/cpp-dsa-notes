<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Sum compared with the int limit"><title>Sum compared with the int limit</title><style>@keyframes a1{0%{transform:scaleX(0);opacity:0}4.0%{transform:scaleX(0);opacity:0}4.5%{transform:scaleX(0);opacity:1}19.0%{transform:scaleX(1);opacity:1}50.0%{transform:scaleX(1);opacity:1}52.0%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:0}}.a1{animation:a1 14s infinite ease-in-out}@keyframes a2{0%{opacity:0}20.0%{opacity:0}22.0%{opacity:1}50.0%{opacity:1}52.0%{opacity:0}100%{opacity:0}}.a2{animation:a2 14s infinite ease-in-out}@keyframes a3{0%{transform:scaleX(0);opacity:0}52.0%{transform:scaleX(0);opacity:0}52.5%{transform:scaleX(0);opacity:1}67.0%{transform:scaleX(1);opacity:1}95.0%{transform:scaleX(1);opacity:1}97.0%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:0}}.a3{animation:a3 14s infinite ease-in-out}@keyframes a4{0%{opacity:0}68.0%{opacity:0}70.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a4{animation:a4 14s infinite ease-in-out}@keyframes a5{0%{opacity:0}4.0%{opacity:0}6.0%{opacity:1}50.0%{opacity:1}52.0%{opacity:0}100%{opacity:0}}.a5{animation:a5 14s infinite ease-in-out}@keyframes a6{0%{opacity:0}52.0%{opacity:0}54.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a6{animation:a6 14s infinite ease-in-out}@keyframes a7{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a7{animation:a7 14s infinite ease-in-out}</style><rect width="840" height="330" rx="14" fill="#0f172a"/><g class="a7" style=""><rect x="70" y="110" width="700" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><line x1="770" y1="104" x2="770" y2="160" stroke="#fbbf24" stroke-width="2" /><text x="770" y="180" font-size="14" fill="#fbbf24" text-anchor="end" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">INT_MAX = 2,147,483,647</text><text x="70" y="180" font-size="14" fill="#94a3b8" text-anchor="start" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">0</text><g class="a1" style="transform-box:fill-box;transform-origin:0% 50%"><rect x="70" y="110" width="326" height="44" rx="8" fill="rgba(74,222,128,0.55)" stroke="#4ade80" stroke-width="2" /></g><g class="a2" style=""><text x="396" y="98" font-size="16" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">sum = 10^9</text></g><g class="a3" style="transform-box:fill-box;transform-origin:0% 50%"><rect x="70" y="110" width="700" height="44" rx="8" fill="rgba(248,113,113,0.5)" stroke="#f87171" stroke-width="2" /><rect x="770" y="110" width="64" height="44" rx="8" fill="rgba(248,113,113,0.5)" stroke="#f87171" stroke-width="2" stroke-dasharray="5 3"/></g><g class="a4" style=""><text x="710" y="98" font-size="16" fill="#f87171" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">sum = 10^14</text></g><g class="a5" style=""><text x="420" y="232" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">max sum = 10^5 × 10^4 = 10^9</text><text x="420" y="266" font-size="21" fill="#4ade80" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓ fits in a 32-bit int</text></g><g class="a6" style=""><text x="420" y="232" font-size="22" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">if values reached 10^9:  10^5 × 10^9 = 10^14</text><text x="420" y="266" font-size="21" fill="#f87171" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗ overflow → use long long</text></g><text x="420" y="312" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">tip: 1LL * a * b  forces the multiplication to happen in long long</text></g></svg>