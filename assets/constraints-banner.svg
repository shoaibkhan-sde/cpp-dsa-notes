<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Understanding problem constraints banner"><title>Understanding problem constraints banner</title><style>@keyframes a1{0%{transform:translate(0px,0px);opacity:1}5.0%{transform:translate(0px,0px);opacity:1}15.0%{transform:translate(0px,-10px);opacity:1}30.0%{transform:translate(0px,-10px);opacity:1}40.0%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:1}}.a1{animation:a1 10s infinite ease-in-out}@keyframes a2{0%{transform:translate(0px,0px);opacity:1}50.0%{transform:translate(0px,0px);opacity:1}60.0%{transform:translate(0px,-10px);opacity:1}75.0%{transform:translate(0px,-10px);opacity:1}85.0%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:1}}.a2{animation:a2 10s infinite ease-in-out}</style><rect width="800" height="230" rx="14" fill="#0f172a"/><text x="400" y="62" font-size="36" fill="#e2e8f0" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Understanding Problem Constraints</text><text x="400" y="94" font-size="17" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">read the limits before you write the code</text><g class="a1" style=""><rect x="135" y="125" width="230" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" /><text x="250.0" y="158" font-size="20" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">1 &lt;= n &lt;= 10^5</text><text x="250.0" y="203" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">how many elements</text></g><g class="a2" style=""><rect x="395" y="125" width="270" height="50" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" /><text x="530.0" y="158" font-size="20" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">1 &lt;= arr[i] &lt;= 10^4</text><text x="530.0" y="203" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">value of each element</text></g></svg>