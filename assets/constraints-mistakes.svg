@keyframes a13{0%{opacity:0}78.0%{opacity:0}80.0%{opacity:1}96.0%{opacity:1}98.0%{opacity:0}100%{opacity:0}}.a13{animation:a13 20s infinite ease-in-out}@keyframes a14{0%{opacity:0}78.0%{opacity:0}80.0%{opacity:1}96.0%{opacity:1}98.0%{opacity:0}100%{opacity:0}}.a14{animation:a14 20s infinite ease-in-out}@keyframes a15{0%{opacity:0}84.0%{opacity:0}86.0%{opacity:1}96.0%{opacity:1}98.0%{opacity:0}100%{opacity:0}}.a15{animation:a15 20s infinite ease-in-out}@keyframes a16{0%{opacity:0}2.0%{opacity:0}4.0%{opacity:1}20.0%{opacity:1}22.0%{opacity:0}100%{opacity:0}}.a16{animation:a16 20s infinite ease-in-out}@keyframes a17{0%{opacity:0}21.0%{opacity:0}23.0%{opacity:1}39.0%{opacity:1}41.0%{opacity:0}100%{opacity:0}}.a17{animation:a17 20s infinite ease-in-out}@keyframes a18{0%{opacity:0}40.0%{opacity:0}42.0%{opacity:1}58.0%{opacity:1}60.0%{opacity:0}100%{opacity:0}}.a18{animation:a18 20s infinite ease-in-out}@keyframes a19{0%{opacity:0}59.0%{opacity:0}61.0%{opacity:1}77.0%{opacity:1}79.0%{opacity:0}100%{opacity:0}}.a19{animation:a19 20s infinite ease-in-out}@keyframes a20{0%{opacity:0}78.0%{opacity:0}80.0%{opacity:1}96.0%{opacity:1}98.0%{opacity:0}100%{opacity:0}}.a20{animation:a20 20s infinite ease-in-out}@keyframes a21{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a21{animation:a21 20s infinite ease-in-out}</style><rect width="860" height="250" rx="14" fill="#0f172a"/><g class="a21" style=""><g class="a1" style=""><text x="430" y="34" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Common mistake #1</text></g><g class="a2" style=""><rect x="30" y="56" width="800" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" /><text x="60" y="93" font-size="22" fill="#f87171" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗</text><text x="100" y="93" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">"arr[] = {100000}" means n = 100000</text></g><g class="a3" style=""><rect x="30" y="132" width="800" height="60" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2" /><text x="60" y="169" font-size="22" fill="#4ade80" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text><text x="100" y="169" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">It has one element, so n = 1</text></g><g class="a4" style=""><text x="430" y="34" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Common mistake #2</text></g><g class="a5" style=""><rect x="30" y="56" width="800" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" /><text x="60" y="93" font-size="22" fill="#f87171" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗</text><text x="100" y="93" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">If n &lt;= 100000, every element can be 100000</text></g><g class="a6" style=""><rect x="30" y="132" width="800" height="60" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2" /><text x="60" y="169" font-size="22" fill="#4ade80" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text><text x="100" y="169" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">A separate value limit may cap elements at 10000</text></g><g class="a7" style=""><text x="430" y="34" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Common mistake #3</text></g><g class="a8" style=""><rect x="30" y="56" width="800" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" /><text x="60" y="93" font-size="22" fill="#f87171" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗</text><text x="100" y="93" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Valid input guarantees the result fits in int</text></g><g class="a9" style=""><rect x="30" y="132" width="800" height="60" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2" /><text x="60" y="169" font-size="22" fill="#4ade80" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text><text x="100" y="169" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Check the result and intermediates separately</text></g><g class="a10" style=""><text x="430" y="34" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Common mistake #4</text></g><g class="a11" style=""><rect x="30" y="56" width="800" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" /><text x="60" y="93" font-size="22" fill="#f87171" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗</text><text x="100" y="93" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">The largest input always needs the same algorithm</text></g><g class="a12" style=""><rect x="30" y="132" width="800" height="60" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2" /><text x="60" y="169" font-size="22" fill="#4ade80" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text><text x="100" y="169" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Consider time, memory, test cases and operation cost</text></g><g class="a13" style=""><text x="430" y="34" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Common mistake #5</text></g><g class="a14" style=""><rect x="30" y="56" width="800" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" /><text x="60" y="93" font-size="22" fill="#f87171" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✗</text><text x="100" y="93" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">O(n²) is always too slow when n = 100000</text></g><g class="a15" style=""><rect x="30" y="132" width="800" height="60" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2" /><text x="60" y="169" font-size="22" fill="#4ade80" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">✓</text><text x="100" y="169" font-size="20" fill="#e2e8f0" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Usually a warning sign — estimate the actual work</text></g><circle cx="380" cy="226" r="5" fill="#334155" stroke="none" stroke-width="0" /><g class="a16" style=""><circle cx="380" cy="226" r="5" fill="#fbbf24" stroke="none" stroke-width="0" /></g><circle cx="405" cy="226" r="5" fill="#334155" stroke="none" stroke-width="0" /><g class="a17" style=""><circle cx="405" cy="226" r="5" fill="#fbbf24" stroke="none" stroke-width="0" /></g><circle cx="430" cy="226" r="5" fill="#334155" stroke="none" stroke-width="0" /><g class="a18" style=""><circle cx="430" cy="226" r="5" fill="#fbbf24" stroke="none" stroke-width="0" /></g><circle cx="455" cy="226" r="5" fill="#334155" stroke="none" stroke-width="0" /><g class="a19" style=""><circle cx="455" cy="226" r="5" fill="#fbbf24" stroke="none" stroke-width="0" /></g><circle cx="480" cy="226" r="5" fill="#334155" stroke="none" stroke-width="0" /><g class="a20" style=""><circle cx="480" cy="226" r="5" fill="#fbbf24" stroke="none" stroke-width="0" /></g></g></svg>