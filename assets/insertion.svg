<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Inserting 25 at index 2 shifts later elements right"><title>Inserting 25 at index 2 shifts later elements right</title><style>@keyframes a1{0%{transform:translate(0px,0px);opacity:1}14.0%{transform:translate(0px,0px);opacity:1}26.0%{transform:translate(120px,0px);opacity:1}100%{transform:translate(120px,0px);opacity:1}}.a1{animation:a1 14s infinite ease-in-out}@keyframes a2{0%{transform:translate(0px,0px);opacity:1}28.0%{transform:translate(0px,0px);opacity:1}40.0%{transform:translate(120px,0px);opacity:1}100%{transform:translate(120px,0px);opacity:1}}.a2{animation:a2 14s infinite ease-in-out}@keyframes a3{0%{transform:translate(0px,0px);opacity:1}42.0%{transform:translate(0px,0px);opacity:1}54.0%{transform:translate(120px,0px);opacity:1}100%{transform:translate(120px,0px);opacity:1}}.a3{animation:a3 14s infinite ease-in-out}@keyframes a4{0%{opacity:0}52.0%{opacity:0}54.0%{opacity:1}70.0%{opacity:1}72.0%{opacity:0}100%{opacity:0}}.a4{animation:a4 14s infinite ease-in-out}@keyframes a5{0%{transform:translate(0px,-70px);opacity:0}58.0%{transform:translate(0px,-70px);opacity:0}70.0%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:1}}.a5{animation:a5 14s infinite ease-in-out}@keyframes a6{0%{opacity:0}5.0%{opacity:0}7.0%{opacity:1}27.0%{opacity:1}29.0%{opacity:0}100%{opacity:0}}.a6{animation:a6 14s infinite ease-in-out}@keyframes a7{0%{opacity:0}27.0%{opacity:0}29.0%{opacity:1}41.0%{opacity:1}43.0%{opacity:0}100%{opacity:0}}.a7{animation:a7 14s infinite ease-in-out}@keyframes a8{0%{opacity:0}41.0%{opacity:0}43.0%{opacity:1}55.0%{opacity:1}57.0%{opacity:0}100%{opacity:0}}.a8{animation:a8 14s infinite ease-in-out}@keyframes a9{0%{opacity:0}55.0%{opacity:0}57.0%{opacity:1}75.0%{opacity:1}77.0%{opacity:0}100%{opacity:0}}.a9{animation:a9 14s infinite ease-in-out}@keyframes a10{0%{opacity:0}75.0%{opacity:0}77.0%{opacity:1}95.0%{opacity:1}97.0%{opacity:0}100%{opacity:0}}.a10{animation:a10 14s infinite ease-in-out}@keyframes a11{0%{opacity:0}1.2%{opacity:1}95.0%{opacity:1}98.5%{opacity:0}100%{opacity:0}}.a11{animation:a11 14s infinite ease-in-out}</style><rect width="800" height="330" rx="14" fill="#0f172a"/><g class="a11" ><text x="400" y="36" font-size="20" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">v.insert(v.begin() + 2, 25);</text><text x="102.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">0</text><text x="222.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">1</text><text x="342.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">2</text><text x="462.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">3</text><text x="582.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">4</text><text x="702.0" y="95" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="400">5</text><rect x="650" y="107" width="104" height="64" rx="8" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><rect x="50" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="102.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">10</text><rect x="170" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" /><text x="222.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">20</text><g class="a1" ><rect x="530" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" /><text x="582.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">50</text></g><g class="a2" ><rect x="410" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" /><text x="462.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">40</text></g><g class="a3" ><rect x="290" y="107" width="104" height="64" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5" /><text x="342.0" y="149" font-size="24" fill="#e2e8f0" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">30</text></g><g class="a4" ><rect x="290" y="107" width="104" height="64" rx="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/></g><g class="a5" ><rect x="290" y="107" width="104" height="64" rx="8" fill="rgba(74,222,128,0.22)" stroke="#4ade80" stroke-width="3" /><text x="342.0" y="149" font-size="24" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">25</text></g><g class="a6" ><text x="400" y="225" font-size="21" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 1: shift 50 →</text></g><g class="a7" ><text x="400" y="225" font-size="21" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 2: shift 40 →</text></g><g class="a8" ><text x="400" y="225" font-size="21" fill="#fbbf24" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 3: shift 30 →</text></g><g class="a9" ><text x="400" y="225" font-size="21" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">Step 4: place 25 at index 2</text></g><g class="a10" ><text x="400" y="225" font-size="21" fill="#4ade80" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-weight="700">v = [10, 20, 25, 30, 40, 50]    → O(n) (elements shifted)</text></g><text x="400" y="300" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400">Everything after the insertion point moves one place → cost grows with n</text></g></svg>